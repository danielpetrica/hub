# Turn AppSec (in-band) blocks on the php2shell / PHP upload-progress kits
# into immediate IP bans. The `crowdsecurity/appsec-logs` parser emits
# evt.Meta.log_type == "appsec-block" for every blocked request.
type: trigger
name: danielpetrica/appsec-php2shell-ban
description: "Ban source IPs whose request was blocked by the PHP upload-progress / php2shell AppSec rules"
filter: |
  evt.Meta.log_type == "appsec-block" &&
  (
    evt.Meta.rule_name == "danielpetrica/php-upload-progress" ||
    evt.Meta.rule_name == "danielpetrica/php-ini-injection-probe" ||
    evt.Meta.rule_name == "danielpetrica/php2shell-user-agent" ||
    evt.Meta.rule_name == "crowdsecurity/vpatch-CVE-2026-109618"
  )
groupby: "evt.Meta.source_ip"
blackhole: 5m
labels:
  service: http
  type: exploit
  remediation: true
  confidence: 5
  spoofable: 0
  behavior: "http:exploit"
  label: "php2shell / PHP upload-progress AppSec block"
  classification:
    - attack.T1190
    - cve.CVE-2026-109618
    - cve.CVE-2026-109619
    - cwe.CWE-416
